<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Phone preview</title>
<style>
  body { margin: 0; background: #222; display: flex; gap: 24px; padding: 16px; align-items: flex-start; font: 13px system-ui; color: #aaa; }
  figure { margin: 0; }
  iframe { border: 0; border-radius: 18px; background: #000; display: block; }
</style>
</head>
<body>
  <!-- Dev only: the game at common phone sizes. ?slot keeps these saves apart from your real one. -->
  <figure><iframe id="p" src="/?slot=phone" width="390" height="844"></iframe><figcaption>390×844 portrait</figcaption></figure>
  <figure><iframe id="l" src="/?slot=phone-land" width="844" height="390"></iframe><figcaption>844×390 landscape</figcaption></figure>
</body>
</html>
