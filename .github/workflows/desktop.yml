name: Desktop builds

# Push a version tag (git tag v0.2.0 && git push origin v0.2.0) to build the desktop app for Mac, Windows and
# Linux and publish them on a GitHub Release. Running it by hand builds them without a release (download them from
# the run's artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the release job can write (to publish the release).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      # The app's version follows the tag (v0.2.0 -> 0.2.0).
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
        working-directory: desktop
        shell: bash
      - run: npx electron-builder ${{ matrix.target }} --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deepheart-${{ runner.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Deepheart ${{ github.ref_name }}
          files: files/*
          body: |
            Deepheart for your desktop. It keeps playing while minimised and works offline.

            **Mac:** `mac-arm64` for Apple Silicon (M1 and newer), `mac-x64` for older Intel Macs. Open the .dmg and drag Deepheart into Applications. The first time you open it, macOS will say it can't verify the app: open System Settings → Privacy & Security, scroll down and click **Open Anyway**.

            **Windows:** run the setup .exe. If Windows shows "Windows protected your PC", click **More info**, then **Run anyway**.

            **Linux:** download the .AppImage, mark it executable, and run it.

            Or play in your browser: https://jamesurobertson.github.io/deepheart/
